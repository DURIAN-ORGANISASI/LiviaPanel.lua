<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="PANEL CONTROLS"><title>PANEL CONTROLS</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#151a35"/><stop offset="1" stop-color="#25265b"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#777cff"/><stop offset="1" stop-color="#48c9e8"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#777cff" stop-opacity=".28"/><stop offset="1" stop-color="#777cff" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="320" fill="url(#bg)"/><circle cx="1075.2" cy="57.599999999999994" r="144" fill="url(#glow)"/><circle cx="128" cy="288" r="112" fill="url(#glow)" opacity=".55"/><path d="M0 256 Q448 204.8 832 272 T1280 240" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/><text x="48" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="900" fill="#f5f7ff" text-anchor="start">PANEL CONTROLS</text><text x="48" y="84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#a8b2d0" text-anchor="start">A simple flow with no external UI library</text><rect x="42" y="116" width="278" height="154" rx="18" fill="#1c2540" stroke="#374461"/><circle cx="77" cy="151" r="17" fill="url(#accent)"/><text x="77" y="156" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">01</text><text x="64" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#f5f7ff" text-anchor="start">Tap</text><text x="64" y="232" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#a8b2d0" text-anchor="start">Toggle a feature</text><text x="64" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="800" fill="#48c9e