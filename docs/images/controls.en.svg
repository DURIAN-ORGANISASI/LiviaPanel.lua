="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#a8b2d0" text-anchor="start">Clean up active features and UI</text><text x="970" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="800" fill="#48c9e8" text-anchor="start">CLEAN</text></svg>