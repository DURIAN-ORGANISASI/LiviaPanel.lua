<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Livia Panel controls</title><desc id="desc">Panel interaction guide.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090E1C"/><stop offset=".56" stop-color="#111A2D"/><stop offset="1" stop-color="#171B39"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7B82FF"/><stop offset="1" stop-color="#35D4E8"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7B82FF"/><stop offset="1" stop-color="#35D4E8"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B2640"/><stop offset="1" stop-color="#11192B"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#91A7D7" fill-opacity=".13"/></pattern>
 <radialGradient id="glow"><stop stop-color="#7079FF" stop-opacity=".21"/><stop offset="1" stop-color="#7079FF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="320" rx="22" fill="url(#bg)"/><rect width="1200" height="320" rx="22" fill="url(#dots)"/>
<ellipse cx="1020" cy="70" rx="370" ry="290" fill="url(#glow)"/><rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#2B3C59"/>
<text x="42" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#F4F7FF" text-anchor="start" >PANEL CONTROLS</text><text x="43" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#A4B5D0" text-anchor="start" >Interaction designed to keep controls touch-friendly.</text><rect x="36" y="112" width="270" height="150" rx="16" fill="#151F33" stroke="#334662"/><rect x="54" y="132" width="42" height="42" rx="12" fill="#1B3450"/><text x="75" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900" fill="#78DFEC" text-anchor="middle" >●</text><text x="54" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#F3F6FF" text-anchor="start" >TAP</text><text x="54" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="800" fill="#A7B7D0" text-anchor="start" >ON/OFF</text><text x="54" y="244" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#8297B7" text-anchor="start" >Tap a button to change its state.</text><rect x="330" y="112" width="270" height="150" rx="16" fill="#151F33" stroke="#334662"/><rect x="348" y="132" width="42" height="42" rx="12" fill="#1B3450"/><text x="369" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900" fill="#78DFEC" text-anchor="middle" >↔</text><text x="348" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#F3F6FF" text-anchor="start" >DRAG</text><text x="348" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="800" fill="#A7B7D0" text-anchor="start" >MOVE</text><text x="348" y="244" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#8297B7" text-anchor="start" >Drag the header to reposition the panel.</text><rect x="624" y="112" width="270" height="150" rx="16" fill="#151F33" stroke="#334662"/><rect x="642" y="132" width="42" height="42" rx="12" fill="#1B3450"/><text x="663" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900" fill="#78DFEC" text-anchor="middle" >−</text><text x="642" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#F3F6FF" text-anchor="start" >MINIMIZE</text><text x="642" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="800" fill="#A7B7D0" text-anchor="start" >REOPEN</text><text x="642" y="244" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#8297B7" text-anchor="start" >The panel collapses to an L button.</text><rect x="918" y="112" width="270" height="150" rx="16" fill="#151F33" stroke="#334662"/><rect x="936" y="132" width="42" height="42" rx="12" fill="#3A2136"/><text x="957" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900" fill="#FFA7B9" text-anchor="middle" >×</text><text x="936" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#F3F6FF" text-anchor="start" >CLOSE</text><text x="936" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="800" fill="#A7B7D0" text-anchor="start" >CLEANUP</text><text x="936" y="244" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#8297B7" text-anchor="start" >Stop features and release connections.</text><text x="42" y="289" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#8094B4" text-anchor="start" >The X control runs cleanup for the features managed by the script.</text>
</svg>