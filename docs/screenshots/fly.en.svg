<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Livia Panel Fly guide</title><desc id="desc">Joystick and camera movement diagram.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090E1C"/><stop offset=".56" stop-color="#111A2D"/><stop offset="1" stop-color="#171B39"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7B82FF"/><stop offset="1" stop-color="#35D4E8"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#91A7D7" fill-opacity=".13"/></pattern>
 <radialGradient id="glow"><stop stop-color="#7079FF" stop-opacity=".21"/><stop offset="1" stop-color="#7079FF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="320" rx="22" fill="url(#bg)"/><rect width="1200" height="320" rx="22" fill="url(#dots)"/>
<ellipse cx="1020" cy="70" rx="370" ry="290" fill="url(#glow)"/><rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#2B3C59"/>
<text x="42" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#F4F7FF" text-anchor="start" >FLY GUIDE</text><text x="43" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#A4B5D0" text-anchor="start" >Joystick and camera pitch work together.</text><rect x="38" y="108" width="1124" height="155" rx="18" fill="#151F33" stroke="#334662"/><circle cx="155" cy="182" r="49" fill="#10192A" stroke="#495B7B" stroke-width="2"/><circle cx="155" cy="182" r="30" fill="#202F4C" stroke="#5D6F92"/><circle cx="155" cy="182" r="13" fill="url(#accent)"/><path d="M155 140v15M155 209v15M113 182h15M182 182h15" stroke="#8B9BBC" stroke-width="2" stroke-linecap="round"/><text x="235" y="151" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#35D4E8" text-anchor="start" >JOYSTICK</text><text x="235" y="176" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="550" fill="#CBD6E8" text-anchor="start" >The joystick sets movement direction.</text><text x="235" y="200" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#879CB9" text-anchor="start" >Camera pitch also influences vertical movement.</text><rect x="610" y="129" width="118" height="104" rx="13" fill="#202C45" stroke="#3A4E70"/><path d="M634 184h70M669 151v66" stroke="#465B7D" stroke-width="1.3" stroke-dasharray="4 4"/><path d="M643 177l26-18 26 18" fill="none" stroke="#8B91FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="669" cy="185" r="7" fill="url(#accent)"/><text x="760" y="151" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#35D4E8" text-anchor="start" >CAMERA PITCH</text><text x="760" y="176" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="550" fill="#CBD6E8" text-anchor="start" >Camera pitch also influences vertical movement.</text><text x="760" y="200" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#879CB9" text-anchor="start" >Release the joystick to stop.</text><rect x="985" y="144" width="148" height="43" rx="10" fill="#303B55" stroke="#45597A"/><text x="1059" y="171" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="900" fill="#F4F7FF" text-anchor="middle" >RELEASE</text><text x="986" y="212" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#879CB9" text-anchor="start" >Stop movement</text><text x="42" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#8094B4" text-anchor="start" >Flight may vary by experience and can be corrected by server-authoritative physics.</text>
</svg>