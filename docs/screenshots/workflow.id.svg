<text x="44" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#F4F7FF" text-anchor="start" >MULAI DALAM EMPAT LANGKAH</text><text x="45" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#A4B5D0" text-anchor="start" >Alur singkat dari skrip sampai cleanup.</text><rect x="36" y="112" width="270" height="154" rx="16" fill="#151F33" stroke="#334662"/><circle cx="65" cy="143" r="16" fill="url(#accent)"/><text x="65" y="147" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#071321" text-anchor="middle" >01</text><text x="56" y="189" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#F3F6FF" text-anchor="start" >SALIN SCRIPT</text><text x="56" y="217" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#9EAFCA" text-anchor="start" >Buka file Lua dari repositori.</text><path d="M56 238H286" stroke="#293C58"/><text x="56" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="850" fill="#7F93B3" text-anchor="start" >LANGKAH 1</text><path d="M311 184h11m-4-4 4 4-4 4" fill="none" stroke="#5DD8E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="330" y="112" width="270" height="154" rx="16" fill="#151F33" stroke="#334662"/><circle cx="359" cy="143" r="16" fill="url(#accent)"/><text x="359" y="147" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#071321" text-anchor="middle" >02</text><text x="350" y="189" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#F3F6FF" text-anchor="start" >JALANKAN</text><text x="350" y="217" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#9EAFCA" text-anchor="start" >Gunakan lingkungan yang mendukung dan mengizinkan.</text><path d="M350 238H580" stroke="#293C58"/><text x="350" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="850" fill="#7F93B3" text-anchor="start" >LANGKAH 2</text><path d="M605 184h11m-4-4 4 4-4 4" fill="none" stroke="#5DD8E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="624" y="112" width="270" height="154" rx="16" fill="#151F33" stroke="#334662"/><circle cx="653" cy="143" r="16" fill="url(#accent)"/><text x="653" y="147" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#071321" text-anchor="middle" >03</text><text x="644" y="189" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#F3F6FF" text-anchor="start" >ATUR KONTROL</text><text x="644" y="217" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#9EAFCA" text-anchor="start" >Aktifkan toggle dan sesuaikan nilai.</text><path d="M644 238H874" stroke="#293C58"/><text x="644" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="850" fill="#7F93B3" text-anchor="start" >LANGKAH 3</text><path d="M899 184h11m-4-4 4 4-4 4" fill="none" stroke="#5DD8E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="918" y="112" width="270" height="154" rx="16" fill="#151F33" stroke="#334662"/><circle cx="947" cy="143" r="16" fill="url(#accent)"/><text x="947" y="147" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#071321" text-anchor="middle" >04</text><text x="938" y="189" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900" fill="#F3F6FF" text-anchor="start" >BERSIHKAN</text><text x="938" y="217" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#9EAFCA" text-anchor="start" >Matikan fitur atau tutup panel.</text><path d="M938 238H1168" stroke="#293C58"/><text x="938" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="850" fill="#7F93B3" text-anchor="start" >LANGKAH 4</text>
