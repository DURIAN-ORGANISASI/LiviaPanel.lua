<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Livia Panel safety notes</title><desc id="desc">Catatan keamanan dan batasan penggunaan.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090E1C"/><stop offset=".56" stop-color="#111A2D"/><stop offset="1" stop-color="#171B39"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7B82FF"/><stop offset="1" stop-color="#35D4E8"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7B82FF"/><stop offset="1" stop-color="#35D4E8"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B2640"/><stop offset="1" stop-color="#11192B"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#91A7D7" fill-opacity=".13"/></pattern>
 <radialGradient id="glow"><stop stop-color="#7079FF" stop-opacity=".21"/><stop offset="1" stop-color="#7079FF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="340" rx="22" fill="url(#bg)"/><rect width="1200" height="340" rx="22" fill="url(#dots)"/>
<ellipse cx="1020" cy="70" rx="370" ry="290" fill="url(#glow)"/><rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#2B3C59"/>
<text x="42" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#F4F7FF" text-anchor="start" >CATATAN PENGGUNAAN</text><text x="43" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#A4B5D0" text-anchor="start" >Pahami batasan sebelum menjalankan skrip pihak ketiga.</text><rect x="36" y="113" width="354" height="170" rx="17" fill="#151F33" stroke="#334662"/><rect x="54" y="132" width="40" height="40" rx="12" fill="#173447"/><text x="74" y="158" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900" fill="#6EDDE9" text-anchor="middle" >01</text><text x="54" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#F3F6FF" text-anchor="start" >Efek sisi klien</text><text x="54" y="231" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#A1B2CC" text-anchor="start" >Perubahan lokal mungkin tidak direplikasi.</text><path d="M54 253H372" stroke="#2A3B56"/><rect x="414" y="113" width="354" height="170" rx="17" fill="#151F33" stroke="#334662"/><rect x="432" y="132" width="40" height="40" rx="12" fill="#31294F"/><text x="452" y="158" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900" fill="#AEB4FF" text-anchor="middle" >02</text><text x="432" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#F3F6FF" text-anchor="start" >Izin pengalaman</text><text x="432" y="231" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#A1B2CC" text-anchor="start" >Gunakan hanya di lingkungan yang mengizinkan.</text><path d="M432 253H750" stroke="#2A3B56"/><rect x="792" y="113" width="354" height="170" rx="17" fill="#151F33" stroke="#334662"/><rect x="810" y="132" width="40" height="40" rx="12" fill="#173447"/><text x="830" y="158" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900" fill="#6EDDE9" text-anchor="middle" >03</text><text x="810" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#F3F6FF" text-anchor="start" >Pemulihan nilai</text><text x="810" y="231" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#A1B2CC" text-anchor="start" >Speed/Jump kembali ke nilai default saat OFF.</text><path d="M810 253H1128" stroke="#2A3B56"/><text x="42" y="311" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#8094B4" text-anchor="start" >Gunakan hanya pada pengalaman milik sendiri atau lingkungan yang secara eksplisit mengizinkan skrip sisi klien.</text>
</svg>